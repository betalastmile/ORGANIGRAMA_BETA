<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigrama de Tiendas</title>
<style>
  :root{
    --bg:#f4f6f5;
    --panel:#ffffff;
    --border:#dfe4e2;
    --text:#1c2622;
    --text-dim:#5c6a64;
    --accent:#1f7a5c;
    --accent-dim:#e6f2ed;
    --danger:#b3432e;
    --radius:10px;
    --shadow:0 2px 10px rgba(20,30,25,0.06);
  }
  [data-theme="dark"]{
    --bg:#121815;
    --panel:#1a221e;
    --border:#2b352f;
    --text:#eef2ef;
    --text-dim:#93a19a;
    --accent:#39b389;
    --accent-dim:#17332a;
    --danger:#e2695a;
    --shadow:0 2px 14px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:background .2s,color .2s;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
  }
  header h1{
    font-size:18px;
    margin:0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  header h1 .badge{
    background:var(--accent);
    color:#fff;
    font-size:12px;
    padding:2px 8px;
    border-radius:20px;
    font-weight:600;
  }
  .header-actions{display:flex;gap:10px;align-items:center;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:8px;
    font-size:14px;
    transition:filter .15s, transform .1s;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--accent);
    color:#fff;
    padding:10px 16px;
    font-weight:600;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--border);
    padding:9px 14px;
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--accent);}
  .icon-btn{
    background:transparent;
    border:1px solid var(--border);
    width:38px;height:38px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);
  }
  .icon-btn:hover{color:var(--accent);border-color:var(--accent);}

  main{padding:20px 24px 60px;max-width:1400px;margin:0 auto;}

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:18px;
  }
  .toolbar input, .toolbar select{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  .toolbar input{flex:1;min-width:220px;}
  .toolbar select{min-width:150px;}

  .summary{
    display:flex;
    gap:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .summary .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 18px;
    min-width:140px;
    box-shadow:var(--shadow);
  }
  .summary .card .num{font-size:22px;font-weight:700;}
  .summary .card .label{font-size:12px;color:var(--text-dim);margin-top:2px;}

  #loading, #empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
  }
  #error-banner{
    background:#fbe7e3;
    color:var(--danger);
    border:1px solid var(--danger);
    padding:12px 16px;
    border-radius:8px;
    margin-bottom:16px;
    font-size:14px;
    display:none;
    line-height:1.5;
  }
  [data-theme="dark"] #error-banner{background:#2b1a17;}
  #error-banner strong{display:block;margin-bottom:4px;}

  .status-pill{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:.3px;
    white-space:nowrap;
  }
  .status-activa{background:#e1f4ea;color:#1f7a5c;}
  .status-inactiva{background:#fbe7e3;color:#b3432e;}
  [data-theme="dark"] .status-activa{background:#153228;color:#4fd6a6;}
  [data-theme="dark"] .status-inactiva{background:#33201c;color:#f0857a;}

  /* ---------- Árbol jerárquico ---------- */
  .tree{display:flex;flex-direction:column;gap:8px;}
  .node{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .node > summary{
    cursor:pointer;
    padding:11px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    list-style:none;
    user-select:none;
  }
  .node > summary::-webkit-details-marker{display:none;}
  .node > summary::before{
    content:'▸';
    display:inline-block;
    transition:transform .15s;
    color:var(--text-dim);
    font-size:11px;
    width:10px;
    flex-shrink:0;
  }
  .node[open] > summary::before{transform:rotate(90deg);}
  .node .node-icon{font-size:14px;flex-shrink:0;}
  .node .node-name{flex:1;font-weight:600;}
  .node .node-name.empty{color:var(--text-dim);font-style:italic;font-weight:500;}
  .node .count{
    font-size:11px;
    color:var(--accent);
    background:var(--accent-dim);
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .node .children{
    padding:4px 12px 10px 30px;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .level-tl > summary{font-size:15px;}
  .level-tl > summary .node-icon{color:var(--accent);}
  .level-ge > summary{font-size:14px;}
  .level-sg > summary{font-size:13.5px;}
  .level-su > summary{font-size:13px;font-weight:500;}
  .level-su > summary .node-name{font-weight:500;}

  .tiendas-list{padding-top:2px;}
  .tienda-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    background:var(--bg);
    transition:border-color .15s;
  }
  .tienda-row:hover{border-color:var(--accent);}
  .tienda-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot-activa{background:#1f7a5c;}
  .dot-inactiva{background:#b3432e;}
  [data-theme="dark"] .dot-activa{background:#4fd6a6;}
  [data-theme="dark"] .dot-inactiva{background:#f0857a;}
  .tienda-row .t-name{font-weight:600;flex-shrink:0;}
  .tienda-row .t-meta{color:var(--text-dim);font-size:12px;}

  /* Modal */
  .overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(10,15,12,0.55);
    z-index:100;
    align-items:flex-start;
    justify-content:center;
    padding:30px 16px;
    overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    width:100%;
    max-width:640px;
    padding:24px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
  }
  .modal h2{margin:0 0 4px;font-size:18px;}
  .modal .sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
  .form-section{margin-bottom:18px;}
  .form-section .section-title{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--accent);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .form-section .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
  }
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .field-grid.thirds{grid-template-columns:1fr 1fr 1fr;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px;color:var(--text-dim);font-weight:600;}
  .field input, .field select{
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 10px;
    border-radius:7px;
    font-size:14px;
    font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }

  @media (max-width:560px){
    .field-grid, .field-grid.thirds{grid-template-columns:1fr;}
    header{padding:14px 16px;}
    main{padding:16px 16px 60px;}
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--text);
    color:var(--bg);
    padding:12px 20px;
    border-radius:8px;
    font-size:14px;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<header>
  <h1>🏬 Organigrama de Tiendas <span class="badge" id="count-badge">0</span></h1>
  <div class="header-actions">
    <button class="icon-btn" id="theme-toggle" title="Cambiar tema">🌓</button>
    <button class="btn-ghost" id="refresh-btn">↻ Actualizar</button>
    <button class="btn-primary" id="add-btn">+ Agregar tienda</button>
  </div>
</header>

<main>
  <div id="error-banner"></div>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Buscar por sucursal, cliente, ciudad, ID tienda o nombre de responsable...">
    <select id="filter-cliente"><option value="">Cliente (todos)</option></select>
    <select id="filter-estatus">
      <option value="">Estatus (todos)</option>
      <option value="ACTIVA">Activa</option>
      <option value="INACTIVA">Inactiva</option>
    </select>
    <button class="btn-ghost" id="expand-all-btn">Expandir todo</button>
    <button class="btn-ghost" id="collapse-all-btn">Colapsar todo</button>
  </div>

  <div id="loading">Cargando tiendas...</div>
  <div id="empty" style="display:none;">No se encontraron tiendas con esos filtros.</div>
  <div id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">Agregar tienda</h2>
    <div class="sub" id="modal-sub">Completa la jerarquía y los datos básicos de la tienda.</div>

    <form id="tienda-form">
      <input type="hidden" id="rowIndex">

      <div class="form-section">
        <div class="section-title">Jerarquía</div>
        <div class="field-grid">
          <div class="field">
            <label>Team Líder</label>
            <input type="text" id="teamLiderNombre" list="list-teamlider" placeholder="Nombre completo">
          </div>
          <div class="field">
            <label>ID Team Líder</label>
            <input type="text" id="teamLiderId" placeholder="Ej. BMEXH4017">
          </div>
          <div class="field">
            <label>Gerente</label>
            <input type="text" id="gerenteNombre" list="list-gerente" placeholder="Nombre completo">
          </div>
          <div class="field">
            <label>ID Gerente</label>
            <input type="text" id="gerenteId" placeholder="Ej. BMEXS472">
          </div>
          <div class="field">
            <label>Subgerente</label>
            <input type="text" id="subgerenteNombre" list="list-subgerente" placeholder="Nombre completo">
          </div>
          <div class="field">
            <label>ID Subgerente</label>
            <input type="text" id="subgerenteId" placeholder="Ej. BMEXS472">
          </div>
          <div class="field">
            <label>Supervisor</label>
            <input type="text" id="supervisorNombre" list="list-supervisor" placeholder="Nombre completo">
          </div>
          <div class="field">
            <label>ID Supervisor</label>
            <input type="text" id="supervisorId" placeholder="Ej. BMEXS381">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">Datos de la tienda</div>
        <div class="field-grid">
          <div class="field">
            <label>ID Tienda</label>
            <input type="text" id="idTienda" placeholder="Ej. 529">
          </div>
          <div class="field">
            <label>Sucursal</label>
            <input type="text" id="sucursal" placeholder="Nombre de la sucursal" required>
          </div>
          <div class="field">
            <label>Cliente</label>
            <input type="text" id="cliente" list="list-cliente" placeholder="Ej. WALMART">
          </div>
          <div class="field">
            <label>Proyecto</label>
            <input type="text" id="proyecto" list="list-proyecto" placeholder="Ej. SAD">
          </div>
          <div class="field">
            <label>Formato</label>
            <input type="text" id="formato" list="list-formato" placeholder="Ej. SAMS">
          </div>
          <div class="field">
            <label>Determinante</label>
            <input type="text" id="determinante" placeholder="Ej. 4985">
          </div>
          <div class="field">
            <label>Estado</label>
            <input type="text" id="estado" list="list-estado" placeholder="Ej. CDMX">
          </div>
          <div class="field">
            <label>Ciudad</label>
            <input type="text" id="ciudad" placeholder="Ej. Cuauhtémoc">
          </div>
          <div class="field">
            <label>Tipo de tienda</label>
            <select id="tipoTienda">
              <option value="">-- Selecciona --</option>
              <option value="FIJA">Fija</option>
              <option value="SPOT">Spot</option>
              <option value="APOYO">Apoyo</option>
            </select>
          </div>
          <div class="field">
            <label>Estatus</label>
            <select id="estatus">
              <option value="ACTIVA">Activa</option>
              <option value="INACTIVA">Inactiva</option>
            </select>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancel-btn">Cancelar</button>
        <button type="submit" class="btn-primary" id="save-btn">Guardar tienda</button>
      </div>
    </form>
  </div>
</div>

<datalist id="list-teamlider"></datalist>
<datalist id="list-gerente"></datalist>
<datalist id="list-subgerente"></datalist>
<datalist id="list-supervisor"></datalist>
<datalist id="list-cliente"></datalist>
<datalist id="list-proyecto"></datalist>
<datalist id="list-formato"></datalist>
<datalist id="list-estado"></datalist>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIGURACIÓN: pega aquí la URL de tu Web App de Apps Script
// ============================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHJ7XBZ8YQbrfu1jYn1TPfCnaMMwVx9NA4uViCcP_PuQUsWR_QJvXLL-27g2uWNED1/exec';

// Tiempo máximo de espera para la carga inicial antes de mostrar error (ms)
const FETCH_TIMEOUT_MS = 20000;

let tiendas = [];
let editingRowIndex = null;

const $ = (id) => document.getElementById(id);

// ---------- Tema ----------
function initTheme(){
  const saved = localStorage.getItem('organigrama-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
}
$('theme-toggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('organigrama-theme', next);
});
initTheme();

// ---------- Toast ----------
function showToast(msg, isError){
  const t = $('toast');
  t.textContent = msg;
  t.style.background = isError ? '#b3432e' : '';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function showError(msg){
  const banner = $('error-banner');
  banner.innerHTML = msg;
  banner.style.display = 'block';
}
function clearError(){
  $('error-banner').style.display = 'none';
}

// Ayuda a fetch con un límite de tiempo, para no quedarse "Cargando..." para siempre
function fetchConTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
}

// ---------- Carga de datos ----------
async function loadTiendas(){
  $('loading').style.display = 'block';
  $('grid').innerHTML = '';
  $('empty').style.display = 'none';
  clearError();

  if (APPS_SCRIPT_URL.includes('PEGA_AQUI')){
    $('loading').style.display = 'none';
    showError('Falta configurar APPS_SCRIPT_URL en el código. Pega la URL de tu Web App de Apps Script.');
    return;
  }

  // Si se abrió el archivo con doble clic (file://) en vez de servirlo por http(s)://,
  // el navegador bloquea o cuelga las peticiones al Web App de Apps Script.
  if (location.protocol === 'file:'){
    $('loading').style.display = 'none';
    showError(
      '<strong>Este archivo se está abriendo directamente desde tu computadora (file://).</strong>' +
      'Los navegadores bloquean las conexiones a Google Apps Script cuando el HTML no se sirve por http(s)://. ' +
      'Ábrelo con la extensión "Live Server" en VS Code, o súbelo a GitHub Pages y ábrelo desde esa URL.'
    );
    return;
  }

  try{
    const res = await fetchConTimeout(APPS_SCRIPT_URL, {}, FETCH_TIMEOUT_MS);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error desconocido del backend');
    tiendas = data.tiendas || [];
    populateDatalists();
    populateFilters();
    renderSummary();
    applyFilters();
  }catch(err){
    if (err.name === 'AbortError'){
      showError(
        '<strong>La solicitud tardó demasiado y se canceló (' + (FETCH_TIMEOUT_MS/1000) + 's).</strong>' +
        'Revisa que la URL de Apps Script sea correcta y que el despliegue siga activo (Implementar → Administrar implementaciones).'
      );
    }else{
      showError('No se pudo cargar la información: ' + err.message);
    }
  }finally{
    $('loading').style.display = 'none';
  }
}

function populateDatalists(){
  const fill = (listId, values) => {
    const list = $(listId);
    list.innerHTML = '';
    [...new Set(values.filter(Boolean))].sort().forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      list.appendChild(opt);
    });
  };
  fill('list-teamlider', tiendas.map(t => t.teamLiderNombre));
  fill('list-gerente', tiendas.map(t => t.gerenteNombre));
  fill('list-subgerente', tiendas.map(t => t.subgerenteNombre));
  fill('list-supervisor', tiendas.map(t => t.supervisorNombre));
  fill('list-cliente', tiendas.map(t => t.cliente));
  fill('list-proyecto', tiendas.map(t => t.proyecto));
  fill('list-formato', tiendas.map(t => t.formato));
  fill('list-estado', tiendas.map(t => t.estado));
}

function populateFilters(){
  const sel = $('filter-cliente');
  const current = sel.value;
  sel.innerHTML = '<option value="">Cliente (todos)</option>';
  [...new Set(tiendas.map(t => t.cliente).filter(Boolean))].sort().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function renderSummary(){
  const total = tiendas.length;
  const activas = tiendas.filter(t => (t.estatus || '').toUpperCase() === 'ACTIVA').length;
  const inactivas = total - activas;
  const clientes = new Set(tiendas.map(t => t.cliente).filter(Boolean)).size;
  const teamLideres = new Set(tiendas.map(t => t.teamLiderNombre).filter(Boolean)).size;

  $('summary').innerHTML = `
    <div class="card"><div class="num">${teamLideres}</div><div class="label">Team Líderes</div></div>
    <div class="card"><div class="num">${total}</div><div class="label">Tiendas totales</div></div>
    <div class="card"><div class="num">${activas}</div><div class="label">Activas</div></div>
    <div class="card"><div class="num">${inactivas}</div><div class="label">Inactivas</div></div>
    <div class="card"><div class="num">${clientes}</div><div class="label">Clientes</div></div>
  `;
  $('count-badge').textContent = total;
}

// ---------- Filtros / búsqueda ----------
function applyFilters(){
  const q = $('search').value.trim().toLowerCase();
  const clienteFilter = $('filter-cliente').value;
  const estatusFilter = $('filter-estatus').value;

  const filtered = tiendas.filter(t => {
    if (clienteFilter && t.cliente !== clienteFilter) return false;
    if (estatusFilter && (t.estatus || '').toUpperCase() !== estatusFilter) return false;
    if (!q) return true;
    const haystack = [
      t.sucursal, t.cliente, t.ciudad, t.estado, t.idTienda,
      t.teamLiderNombre, t.gerenteNombre, t.subgerenteNombre, t.supervisorNombre
    ].join(' ').toLowerCase();
    return haystack.includes(q);
  });

  renderGrid(filtered);
}

$('search').addEventListener('input', applyFilters);
$('filter-cliente').addEventListener('change', applyFilters);
$('filter-estatus').addEventListener('change', applyFilters);
$('refresh-btn').addEventListener('click', loadTiendas);

// ---------- Árbol: Team Líder > Gerente > Subgerente > Supervisor > Tiendas ----------
const SIN_ASIGNAR = 'Sin asignar';

function buildTree(list){
  const tree = {};
  list.forEach(t => {
    const tl = t.teamLiderNombre || SIN_ASIGNAR;
    const ge = t.gerenteNombre || SIN_ASIGNAR;
    const sg = t.subgerenteNombre || SIN_ASIGNAR;
    const su = t.supervisorNombre || SIN_ASIGNAR;
    tree[tl] = tree[tl] || {};
    tree[tl][ge] = tree[tl][ge] || {};
    tree[tl][ge][sg] = tree[tl][ge][sg] || {};
    tree[tl][ge][sg][su] = tree[tl][ge][sg][su] || [];
    tree[tl][ge][sg][su].push(t);
  });
  return tree;
}

function countLeaves(node){
  if (Array.isArray(node)) return node.length;
  return Object.values(node).reduce((sum, child) => sum + countLeaves(child), 0);
}

function sortedKeys(obj){
  return Object.keys(obj).sort((a, b) => {
    if (a === SIN_ASIGNAR) return 1;
    if (b === SIN_ASIGNAR) return -1;
    return a.localeCompare(b, 'es');
  });
}

function makeNode(name, count, levelClass, icon, forceOpen){
  const det = document.createElement('details');
  det.className = 'node ' + levelClass;
  if (forceOpen) det.open = true;
  const summary = document.createElement('summary');
  summary.innerHTML = `
    <span class="node-icon">${icon}</span>
    <span class="node-name ${name === SIN_ASIGNAR ? 'empty' : ''}">${escapeHtml(name)}</span>
    <span class="count">${count} tienda${count !== 1 ? 's' : ''}</span>
  `;
  det.appendChild(summary);
  return det;
}

function renderTienda(t){
  const row = document.createElement('div');
  row.className = 'tienda-row';
  const isActiva = (t.estatus || '').toUpperCase() === 'ACTIVA';
  row.innerHTML = `
    <span class="dot ${isActiva ? 'dot-activa' : 'dot-inactiva'}"></span>
    <span class="t-name">${escapeHtml(t.sucursal || 'Sin nombre')}</span>
    <span class="t-meta">${[t.cliente, t.formato, t.ciudad, t.idTienda ? 'ID ' + t.idTienda : ''].filter(Boolean).map(escapeHtml).join(' · ')}</span>
  `;
  row.addEventListener('click', () => openModal(t));
  return row;
}

function renderTree(tree, forceOpen){
  const container = document.createElement('div');
  container.className = 'tree';

  sortedKeys(tree).forEach(tl => {
    const gerentes = tree[tl];
    const nodeTl = makeNode(tl, countLeaves(gerentes), 'level-tl', '👑', forceOpen);
    const childrenTl = document.createElement('div');
    childrenTl.className = 'children';

    sortedKeys(gerentes).forEach(ge => {
      const subgerentes = gerentes[ge];
      const nodeGe = makeNode(ge, countLeaves(subgerentes), 'level-ge', '🧭', forceOpen);
      const childrenGe = document.createElement('div');
      childrenGe.className = 'children';

      sortedKeys(subgerentes).forEach(sg => {
        const supervisores = subgerentes[sg];
        const nodeSg = makeNode(sg, countLeaves(supervisores), 'level-sg', '🧩', forceOpen);
        const childrenSg = document.createElement('div');
        childrenSg.className = 'children';

        sortedKeys(supervisores).forEach(su => {
          const tiendasList = supervisores[su].slice().sort((a, b) =>
            (a.sucursal || '').localeCompare(b.sucursal || '', 'es'));
          const nodeSu = makeNode(su, tiendasList.length, 'level-su', '🧑\u200d💼', forceOpen);
          const tiendasWrap = document.createElement('div');
          tiendasWrap.className = 'children tiendas-list';
          tiendasList.forEach(t => tiendasWrap.appendChild(renderTienda(t)));
          nodeSu.appendChild(tiendasWrap);
          childrenSg.appendChild(nodeSu);
        });

        nodeSg.appendChild(childrenSg);
        childrenGe.appendChild(nodeSg);
      });

      nodeGe.appendChild(childrenGe);
      childrenTl.appendChild(nodeGe);
    });

    nodeTl.appendChild(childrenTl);
    container.appendChild(nodeTl);
  });

  return container;
}

function renderGrid(list){
  const grid = $('grid');
  grid.innerHTML = '';

  if (list.length === 0){
    $('empty').style.display = 'block';
    return;
  }
  $('empty').style.display = 'none';

  const hasActiveFilter = !!($('search').value.trim() || $('filter-cliente').value || $('filter-estatus').value);
  const tree = buildTree(list);
  grid.appendChild(renderTree(tree, hasActiveFilter));
}

$('expand-all-btn').addEventListener('click', () => {
  $('grid').querySelectorAll('details.node').forEach(d => d.open = true);
});
$('collapse-all-btn').addEventListener('click', () => {
  $('grid').querySelectorAll('details.node').forEach(d => d.open = false);
});

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ---------- Modal ----------
const overlay = $('overlay');
const form = $('tienda-form');

function openModal(tienda){
  form.reset();
  if (tienda){
    editingRowIndex = tienda.rowIndex;
    $('modal-title').textContent = 'Editar tienda';
    $('modal-sub').textContent = 'Actualiza la jerarquía o los datos de esta tienda.';
    $('rowIndex').value = tienda.rowIndex;
    $('teamLiderNombre').value = tienda.teamLiderNombre || '';
    $('teamLiderId').value = tienda.teamLiderId || '';
    $('gerenteNombre').value = tienda.gerenteNombre || '';
    $('gerenteId').value = tienda.gerenteId || '';
    $('subgerenteNombre').value = tienda.subgerenteNombre || '';
    $('subgerenteId').value = tienda.subgerenteId || '';
    $('supervisorNombre').value = tienda.supervisorNombre || '';
    $('supervisorId').value = tienda.supervisorId || '';
    $('idTienda').value = tienda.idTienda || '';
    $('sucursal').value = tienda.sucursal || '';
    $('cliente').value = tienda.cliente || '';
    $('proyecto').value = tienda.proyecto || '';
    $('formato').value = tienda.formato || '';
    $('determinante').value = tienda.determinante || '';
    $('estado').value = tienda.estado || '';
    $('ciudad').value = tienda.ciudad || '';
    $('tipoTienda').value = tienda.tipoTienda || '';
    $('estatus').value = (tienda.estatus || 'ACTIVA').toUpperCase();
  } else {
    editingRowIndex = null;
    $('modal-title').textContent = 'Agregar tienda';
    $('modal-sub').textContent = 'Completa la jerarquía y los datos básicos de la tienda.';
    $('estatus').value = 'ACTIVA';
  }
  overlay.classList.add('open');
}

function closeModal(){
  overlay.classList.remove('open');
}

$('add-btn').addEventListener('click', () => openModal(null));
$('cancel-btn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (APPS_SCRIPT_URL.includes('PEGA_AQUI')){
    showToast('Falta configurar APPS_SCRIPT_URL en el código.', true);
    return;
  }

  const data = {
    teamLiderNombre: $('teamLiderNombre').value.trim(),
    teamLiderId: $('teamLiderId').value.trim(),
    gerenteNombre: $('gerenteNombre').value.trim(),
    gerenteId: $('gerenteId').value.trim(),
    subgerenteNombre: $('subgerenteNombre').value.trim(),
    subgerenteId: $('subgerenteId').value.trim(),
    supervisorNombre: $('supervisorNombre').value.trim(),
    supervisorId: $('supervisorId').value.trim(),
    idTienda: $('idTienda').value.trim(),
    sucursal: $('sucursal').value.trim(),
    cliente: $('cliente').value.trim(),
    proyecto: $('proyecto').value.trim(),
    formato: $('formato').value.trim(),
    determinante: $('determinante').value.trim(),
    estado: $('estado').value.trim(),
    ciudad: $('ciudad').value.trim(),
    tipoTienda: $('tipoTienda').value,
    estatus: $('estatus').value
  };

  const saveBtn = $('save-btn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Guardando...';

  try{
    const payload = editingRowIndex
      ? { action: 'update', rowIndex: editingRowIndex, data }
      : { action: 'create', data };

    const res = await fetchConTimeout(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    }, FETCH_TIMEOUT_MS);
    const result = await res.json();
    if (!result.ok) throw new Error(result.error || 'Error desconocido del backend');

    showToast(editingRowIndex ? 'Tienda actualizada ✓' : 'Tienda agregada ✓');
    closeModal();
    await loadTiendas();
  }catch(err){
    const msg = err.name === 'AbortError' ? 'la solicitud tardó demasiado y se canceló' : err.message;
    showToast('Error al guardar: ' + msg, true);
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = 'Guardar tienda';
  }
});

// ---------- Init ----------
loadTiendas();
</script>
